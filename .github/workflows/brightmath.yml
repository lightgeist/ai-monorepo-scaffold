name: brightmath release qualification
on:
  push:
    branches: ['brightmath/rebrand-20260929']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brightmath-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize pinned source and original brightmath identity
        run: |
          set -euo pipefail
          git clone https://github.com/grmchn/dopa-drill.git brightmath
          git -C brightmath checkout --detach fdacd5fc8322f251f92ddc07f13ae85ccb2263dd
          mkdir -p brightmath/evidence
          (cd brightmath && node --test tests/*.test.mjs) > brightmath/evidence/upstream-baseline.log
          python3 brightmath-build/prepare.py
          python3 brightmath-build/rebrand.py brightmath
          python3 brightmath-build/finish.py brightmath
          python3 brightmath-build/artwork-cleanup.py brightmath
          cp .github/workflows/brightmath.yml brightmath/provenance/brightmath-build-recipe/workflow.yml
          node --version > brightmath/evidence/environment.txt
          npm --version >> brightmath/evidence/environment.txt
      - name: Build the runtime once and qualify identity and mathematics
        run: |
          set -euo pipefail
          cd brightmath
          npm install --no-fund --no-audit
          npm run build | tee evidence/build.log
          npm run qualify | tee evidence/static.log
          npm test | tee evidence/unit-tests.log
          npx playwright install --with-deps chromium firefox webkit
      - name: Actual desktop and mobile browser user journeys
        run: |
          set -o pipefail
          cd brightmath
          npm run test:browser 2>&1 | tee evidence/browser.log
      - uses: actions/setup-node@v4
        if: success()
        with:
          node-version: '24'
      - name: Independent agent-browser smoke check
        if: success()
        run: |
          set -euo pipefail
          cd brightmath
          node server.mjs dist/site > evidence/agent-browser-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          npm install --prefix "$RUNNER_TEMP/browser-agent" agent-browser@0.38.1 --no-fund --no-audit
          AB="$RUNNER_TEMP/browser-agent/node_modules/.bin/agent-browser"
          "$AB" --executable-path /usr/bin/google-chrome open 'http://127.0.0.1:4173/?capture' | tee evidence/agent-browser-open.txt
          "$AB" snapshot -i | tee evidence/agent-browser-snapshot.txt
          "$AB" screenshot "$PWD/evidence/agent-browser-title.png"
          "$AB" get title | tee evidence/agent-browser-title.txt
          "$AB" close
      - name: Package exact tested source/runtime and verify archive contents
        if: success()
        run: python3 brightmath-build/package-release.py brightmath
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: brightmath-1.0.0-delivery
          path: publish/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Compact diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          e=Path('brightmath/evidence');e.mkdir(parents=True,exist_ok=True)
          if (e/'browser-results.json').exists():
            obj=json.loads((e/'browser-results.json').read_text()); print('BROWSER_STATS',obj.get('stats'))
            def walk(s):
              for spec in s.get('specs',[]):
                for test in spec.get('tests',[]):
                  for result in test.get('results',[]):
                    if result.get('status') not in ('passed','skipped'):
                      print('FAILURE',spec['title'],test.get('projectName'),json.dumps(result.get('errors')))
              for item in s.get('suites',[]):walk(item)
            walk(obj)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brightmath-test-evidence
          path: brightmath/evidence/
          retention-days: 30
  publish:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: brightmath-1.0.0-delivery
          path: publish
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create brightmath-v1.0.0-20260929 publish/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'brightmath 1.0.0 — Japanese browser edition' --notes-file publish/brightmath-1.0.0-release-report.md
