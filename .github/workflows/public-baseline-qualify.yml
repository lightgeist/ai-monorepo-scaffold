name: Pinned public upstream baseline qualification
on:
  push:
    branches: ['build-tools/source-c024e104-20260919']
    paths: ['.github/workflows/public-baseline-qualify.yml']
permissions:
  contents: read
concurrency:
  group: public-baseline-c024e104-20260919
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [checks, web-build]
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - name: Acquire exact public baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline/evidence" "$RUNNER_TEMP/baseline/delivery"
          cd "$RUNNER_TEMP/baseline"
          git init source
          cd source
          git remote add upstream https://github.com/agentsea/nautilo.git
          git fetch --depth=1 upstream c024e1044a1d5e091d64e41aa912c99ec366ae9b
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = c024e1044a1d5e091d64e41aa912c99ec366ae9b
          bun install --frozen-lockfile 2>&1 | tee ../evidence/install.log
          { node --version; bun --version; git rev-parse HEAD; sha256sum bun.lock; } > ../evidence/identity.txt
      - name: Execute original checks, retaining each result
        if: matrix.lane == 'checks'
        working-directory: ${{ runner.temp }}/baseline/source
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for task in lint typecheck test:unit lint:unused; do
            start=$(date -u +%FT%TZ)
            timeout 900 bun run "$task" > "../evidence/$task.log" 2>&1
            rc=$?
            printf '{"check":"%s","started":"%s","ended":"%s","exit_code":%s}\n' "$task" "$start" "$(date -u +%FT%TZ)" "$rc" >> ../evidence/results.jsonl
            tail -n 30 "../evidence/$task.log"
            if test "$rc" -ne 0; then failed=1; fi
          done
          exit "$failed"
      - name: Build actual unmodified web surfaces
        if: matrix.lane == 'web-build'
        working-directory: ${{ runner.temp }}/baseline/source
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: |
          set -euo pipefail
          bun run build:artifacts 2>&1 | tee ../evidence/web-build.log
          find apps/workbench/dist apps/mobile/dist -type f -print0 | sort -z | xargs -0 sha256sum > ../evidence/web-build-files.sha256
          tar -czf ../delivery/public-upstream-web-build.tar.gz apps/workbench/dist apps/mobile/dist
          sha256sum ../delivery/public-upstream-web-build.tar.gz > ../delivery/web-build.sha256
      - name: Preserve all baseline observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-baseline-${{ matrix.lane }}-evidence
          path: ${{ runner.temp }}/baseline/evidence/
          retention-days: 1
          if-no-files-found: warn
      - name: Transfer unmodified public browser build
        if: matrix.lane == 'web-build' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-upstream-web-build-c024e104
          path: ${{ runner.temp }}/baseline/delivery/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
