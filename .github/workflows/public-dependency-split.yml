name: Split pinned public dependency archive
on:
  push:
    branches: ['build-tools/source-c024e104-20260919']
    paths: ['.github/workflows/public-dependency-split.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: public-dependency-split-c024e104-20260919
  cancel-in-progress: false
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the already-produced public-only artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-split/input" "$RUNNER_TEMP/public-split/parts"
          gh run download 35410336777 --repo lightgeist/ai-monorepo-scaffold --name public-dependencies-c024e104-bun-1.3.11-linux-x64 --dir "$RUNNER_TEMP/public-split/input"
          cd "$RUNNER_TEMP/public-split/input"
          split -b 300M -d -a 2 public-workspace-dependencies.tar.gz ../parts/dependencies.tar.gz.part-
          sha256sum public-workspace-dependencies.tar.gz > ../parts/archive.sha256
          cd ../parts
          sha256sum dependencies.tar.gz.part-* > parts.sha256
          ls -lh
      - name: Part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-dependencies-part-00
          path: ${{ runner.temp }}/public-split/parts/dependencies.tar.gz.part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-dependencies-part-01
          path: ${{ runner.temp }}/public-split/parts/dependencies.tar.gz.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-dependencies-part-02
          path: ${{ runner.temp }}/public-split/parts/dependencies.tar.gz.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Integrity receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-dependencies-split-receipts
          path: ${{ runner.temp }}/public-split/parts/*.sha256
          retention-days: 1
          if-no-files-found: error
