name: Pinned public workspace preparation
on:
  push:
    branches: ['build-tools/source-c024e104-20260919']
    paths: ['.github/workflows/public-dependency-prepare.yml']
permissions:
  contents: read
concurrency:
  group: public-dependency-c024e104-20260919
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.11'
      - name: Acquire pinned public source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-prepare/delivery/toolchain/bin" "$RUNNER_TEMP/public-prepare/evidence"
          cd "$RUNNER_TEMP/public-prepare"
          git init source
          cd source
          git remote add upstream https://github.com/agentsea/nautilo.git
          git fetch --depth=1 upstream c024e1044a1d5e091d64e41aa912c99ec366ae9b
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = c024e1044a1d5e091d64e41aa912c99ec366ae9b
          cp "$(command -v bun)" ../delivery/toolchain/bin/bun
          cp "$(command -v node)" ../delivery/toolchain/bin/node
          { node --version; bun --version; uname -a; sha256sum bun.lock; } > ../evidence/environment.txt
          tar -C ../delivery -czf ../delivery/toolchain-linux-x64.tar.gz toolchain
          sha256sum ../delivery/toolchain-linux-x64.tar.gz > ../delivery/toolchain-linux-x64.sha256
      - name: Transfer unmodified public toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-toolchain-bun-1.3.11-node24-linux-x64
          path: |
            ${{ runner.temp }}/public-prepare/delivery/toolchain-linux-x64.tar.gz
            ${{ runner.temp }}/public-prepare/delivery/toolchain-linux-x64.sha256
            ${{ runner.temp }}/public-prepare/evidence/environment.txt
          retention-days: 1
          if-no-files-found: error
      - name: Frozen upstream install with real postinstall
        id: install
        working-directory: ${{ runner.temp }}/public-prepare/source
        run: |
          set -euo pipefail
          bun install --frozen-lockfile 2>&1 | tee ../evidence/install.log
          sha256sum bun.lock > ../evidence/lock-after.txt
          git status --short > ../evidence/source-status.txt
      - name: Package installed public dependency directories and generated office modules
        if: success()
        working-directory: ${{ runner.temp }}/public-prepare/source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          root=Path('.'); selected=[]
          for parent,dirs,files in os.walk(root):
              dirs[:] = [d for d in dirs if d not in {'.git','.turbo'}]
              for d in list(dirs):
                  if d in {'node_modules','dist','build'}:
                      p=Path(parent)/d
                      if d=='node_modules' or str(p).startswith(('packages/office-','packages/first-party-apps/')):
                          selected.append(str(p)); dirs.remove(d)
          Path('../evidence/install-paths.json').write_text(json.dumps(selected,indent=2))
          Path('../evidence/install-paths.nul').write_bytes(b'\0'.join(p.encode() for p in selected)+b'\0')
          PY
          tar --null -T ../evidence/install-paths.nul -I 'gzip -3' -cf ../delivery/public-workspace-dependencies.tar.gz
          sha256sum ../delivery/public-workspace-dependencies.tar.gz > ../delivery/public-workspace-dependencies.sha256
          du -sh node_modules ../delivery/* | tee ../evidence/sizes.txt
      - name: Transfer exact public dependency preparation
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-dependencies-c024e104-bun-1.3.11-linux-x64
          path: |
            ${{ runner.temp }}/public-prepare/delivery/public-workspace-dependencies.tar.gz
            ${{ runner.temp }}/public-prepare/delivery/public-workspace-dependencies.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Preserve preparation observations even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-preparation-evidence-c024e104
          path: ${{ runner.temp }}/public-prepare/evidence/
          retention-days: 1
          if-no-files-found: warn
