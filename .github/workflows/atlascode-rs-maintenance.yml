name: atlascode-rs source maintenance
on:
  pull_request:
    paths: ['standalone/atlascode-rs/**', '.github/workflows/atlascode-rs-maintenance.yml']
  push:
    branches: [main]
    paths: ['standalone/atlascode-rs/**', '.github/workflows/atlascode-rs-maintenance.yml']
permissions:
  contents: read
concurrency:
  group: atlascode-rs-maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: standalone/atlascode-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.21.0'}
      - name: Complete bridge suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix agent-sdk
          npm --prefix agent-sdk test
          npm --prefix agent-sdk run lint
      - name: Native regression tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --all-targets -- --test-threads=1
          python3 tools/verify-brand.py
      - name: Strict Rust lint
        if: runner.os == 'Linux'
        shell: bash
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
