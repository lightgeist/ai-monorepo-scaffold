name: brightmath focused browser triage
on:
  push:
    branches: ['brightmath/diagnostics-20260929']
    paths: ['.github/workflows/brightmath-triage.yml']
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact candidate and run a bounded subset
        run: |
          set -euo pipefail
          git clone https://github.com/grmchn/dopa-drill.git brightmath
          git -C brightmath checkout --detach fdacd5fc8322f251f92ddc07f13ae85ccb2263dd
          python3 brightmath-build/prepare.py
          python3 brightmath-build/rebrand.py brightmath
          python3 brightmath-build/finish.py brightmath
          python3 brightmath-build/artwork-cleanup.py brightmath
          cd brightmath
          npm install --no-fund --no-audit
          npm run build
          npx playwright install chromium
          npx playwright test --project=chromium-desktop --workers=1 --max-failures=1 --timeout=30000 --grep 'fresh onboarding|grade 1:|complete recorded'
      - name: Print concise failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('brightmath/evidence/browser-results.json')
          if p.exists():
            obj=json.loads(p.read_text());print('STATS',obj.get('stats'))
            def walk(s):
              for spec in s.get('specs',[]):
                for t in spec.get('tests',[]):
                  for r in t.get('results',[]):
                    if r.get('status')!='passed':print('FAILURE',spec['title'],json.dumps(r.get('errors')))
              for item in s.get('suites',[]):walk(item)
            walk(obj)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: brightmath/evidence/browser-results.json
          archive: false
