name: AtlasCanvas public upstream baseline
on:
  push:
    branches: [atlascanvas/public-upstream-transfer]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: robbietilton/Compositor
          ref: a19db9011282399785dc18efcfded904627bdcc2
          persist-credentials: false
          path: upstream
      - name: Package only public MIT source
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json
          root=pathlib.Path('upstream'); manifest={}
          with zipfile.ZipFile('Compositor-upstream.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or '.git' in p.relative_to(root).parts: continue
                  data=p.read_bytes(); name=p.relative_to(root).as_posix(); zi=zipfile.ZipInfo(name,(2026,9,18,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=(p.stat().st_mode & 0xffff)<<16
                  z.writestr(zi,data); manifest[name]=hashlib.sha256(data).hexdigest()
          pathlib.Path('upstream-manifest.json').write_text(json.dumps(manifest,indent=2))
          print(len(manifest),hashlib.sha256(pathlib.Path('Compositor-upstream.zip').read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlascanvas-public-upstream-a19db901
          path: |
            Compositor-upstream.zip
            upstream-manifest.json
          retention-days: 3
          if-no-files-found: error
  native-baseline:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: robbietilton/Compositor
          ref: a19db9011282399785dc18efcfded904627bdcc2
          persist-credentials: false
      - name: Record toolchain and native baseline
        run: |
          mkdir -p evidence
          sw_vers | tee evidence/environment.txt
          xcodebuild -version | tee -a evidence/environment.txt
          set -o pipefail
          xcodebuild -project Compositor.xcodeproj -scheme Compositor -destination 'platform=macOS' -derivedDataPath /tmp/atlas-baseline -resultBundlePath evidence/baseline.xcresult CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO test 2>&1 | tee evidence/baseline.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlascanvas-public-native-baseline
          path: evidence
          retention-days: 3
