name: Nearby isolated emulator tools
on:
  push:
    branches: [build/nearby-toolchain-20261004]
    paths: [.github/workflows/nearby-emulator.yml]
permissions:
  contents: read
jobs:
  emulator-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nearby-emulator-tools
          run-id: 37160545950
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous
      - name: Split runtime archive
        run: |
          mkdir -p "$RUNNER_TEMP/parts"
          split -b 300M -d "$RUNNER_TEMP/previous/nearby-emulator.tar.gz" "$RUNNER_TEMP/parts/part-"
          cd "$RUNNER_TEMP/parts"
          sha256sum part-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-emulator-part-00
          path: ${{ runner.temp }}/parts/part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-emulator-part-01
          path: ${{ runner.temp }}/parts/part-01
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-emulator-part-02
          path: ${{ runner.temp }}/parts/part-02
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-emulator-part-03
          path: ${{ runner.temp }}/parts/part-03
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
