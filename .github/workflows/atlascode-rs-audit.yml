name: atlascode-rs dependency audit
on:
  push:
    branches: ['atlascode-rs/rebrand-20261004']
    paths: ['.github/workflows/atlascode-rs-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atlascode-rs-prepared
          run-id: 37163141327
          github-token: ${{ github.token }}
          path: input
      - name: Pin audited source and capture dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat input/evidence/builder-commit.txt)" = 23c0490f7db0e731f866c34991c4b9f6c14ef7de
          tar -xzf input/source.tar.gz
          mkdir audit-evidence
          cp input/evidence/source-tree.txt audit-evidence/audited-source-tree.txt
          cd atlascode-rs
          cargo metadata --locked --format-version 1 > ../audit-evidence/cargo-metadata.json
          python3 tools/verify-brand.py > ../audit-evidence/dependency-identity-audit.json
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          root=pathlib.Path('../audit-evidence')
          metadata=json.loads((root/'cargo-metadata.json').read_text())
          records=[]
          for pkg in metadata['packages']:
              if pkg['name']=='atlascode-rs':continue
              package_root=pathlib.Path(pkg['manifest_path']).parent
              destination=root/'rust-dependency-notices'/(pkg['name']+'-'+pkg['version'])
              copies=[]
              for path in package_root.iterdir():
                  if path.is_file() and path.name.lower().startswith(('license','licence','copying','copyright','notice')):
                      destination.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(path,destination/path.name)
                      copies.append({'path':str((destination/path.name).relative_to(root)),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
              records.append({'name':pkg['name'],'version':pkg['version'],'license':pkg['license'],'source':pkg['source'],'repository':pkg['repository'],'notices':copies})
          (root/'rust-dependency-inventory.json').write_text(json.dumps({'scope':'all locked dependencies including build and dev; not a claim of static-link composition','packages':records},indent=2)+'\n')
          PY
      - name: Cargo deny licenses, sources, bans and current advisories
        id: deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: atlascode-rs/Cargo.toml
          rust-version: '1.89.0'
          arguments: --all-features
          command: check
          command-arguments: --config atlascode-rs/deny.toml
      - name: Documentation code tests
        working-directory: atlascode-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --doc 2>&1 | tee ../audit-evidence/rust-doc-tests.log
      - name: Record audit scope
        if: always()
        shell: bash
        run: |
          mkdir -p audit-evidence
          printf '%s\n' 'Cargo deny action outcome: ${{ steps.deny.outcome }}' 'Audited builder commit: 23c0490f7db0e731f866c34991c4b9f6c14ef7de' 'Audit run: ${{ github.run_id }}' 'Dependency graph hashes are checked by the brand audit; later test-only corrections do not change these graphs.' > audit-evidence/AUDIT-SCOPE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atlascode-rs-dependency-audit
          path: audit-evidence/
          retention-days: 30
          if-no-files-found: error
