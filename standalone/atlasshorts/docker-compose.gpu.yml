services:
  backend:
    build:
      context: .
      args:
        GPU: "1"
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE: float16
      FFMPEG_ENCODER: auto
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
