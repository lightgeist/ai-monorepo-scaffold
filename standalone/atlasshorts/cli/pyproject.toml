[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepintuition-atlasshorts"
version = "0.1.0-rc.1"
description = "CLI for AtlasShorts: clip long videos into vertical shorts and publish them, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Deep Intuition" }]
keywords = ["video", "clips", "shorts", "ai", "tiktok", "youtube-shorts", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "http://localhost:5175"
Source = "https://github.com/lightgeist/ai-monorepo-scaffold/tree/feature/atlasshorts-v0.1.0-rc.1/standalone/atlasshorts"
Documentation = "http://localhost:5175/mcp"

[project.scripts]
atlasshorts = "atlasshorts_cli:main"

[tool.setuptools]
py-modules = ["atlasshorts_cli"]
